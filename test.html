<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>NAVY</title>

    <link rel="stylesheet" href="style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- HEADER -->
    <header class="header">
      <img class="logo" src="images/logo.png" alt="NAVY logo" />

      <nav class="header-links" aria-label="Main navigation">
        <a href="test.html">Home</a>
        <a href="#">Our Shop</a>
        <a href="#">Contact</a>
        <a href="#">About</a>
        <button type="button">Sign in</button>
      </nav>
    </header>

    <!-- LANDING PAGE -->
    <section class="landing-page">
      <div class="landing-content">
        <span class="landing-label">DISCOVER THE UNKNOWN</span>

        <h1>Find your next obsession.</h1>

        <p>
          Explore unforgettable worlds, hidden gems, and your next favorite
          game.
        </p>

        <div class="search">
          <input
            type="search"
            placeholder="Search for a game..."
            aria-label="Search for a game"
          />
          <button type="button">Search</button>
        </div>
      </div>

      <div class="landing-visual">
        <img src="images/banner-image.jpg" alt="Featured game artwork" />
      </div>
    </section>
  </body>
</html>
